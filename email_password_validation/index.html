<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation Practice Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h2>Create Account</h2>
    <form id="signupForm" novalidate>
      
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="enter email address">
        <small class="error-text" id="emailError">Invalid email format</small>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="enter password">
        <small class="counter" id="passwordCounter">Remaining: 20</small>
        <small class="error-text" id="passwordError">Must be 6-20 characters</small>
      </div>

      <button type="submit" id="submitBtn">Submit</button>
      <div id="resultmessage">
        <p></p>
      </div>
    </form>
  </div>

  <script src="index.js"></script>
</body>
</html>
